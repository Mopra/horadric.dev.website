<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horadric</title>
<meta name="description" content="Every coding agent on your Windows desktop. The one that needs you lights up.">
<link rel="icon" href="horadric.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --off: #15171b;
    --work: #3db4ff;
    --wait: #ffb224;
    --done: #3dd68c;
    --text: #e8e9ed;
    --dim: #5b5f68;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 300 13px/1.5 "Geist Mono", ui-monospace, monospace;
    letter-spacing: .02em;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--text); }
  :focus-visible { outline: 1px solid var(--wait); outline-offset: 4px; }

  .field { display: grid; grid-template-columns: repeat(12, 14px); gap: 12px; }
  .a {
    width: 14px; height: 14px; border-radius: 3px; border: 0; padding: 0; cursor: default;
    background: var(--off);
    transition: background .5s, box-shadow .5s, transform .2s;
  }
  .a.work { background: color-mix(in srgb, var(--work) var(--l, 30%), var(--off)); }
  .a.wait {
    background: var(--wait); cursor: pointer;
    box-shadow: 0 0 12px var(--wait), 0 0 40px rgba(255,178,36,.45);
    animation: call 1.4s ease-in-out infinite;
  }
  .a.wait:hover { transform: scale(1.25); }
  .a.done { background: var(--done); box-shadow: 0 0 14px var(--done); transition: none; }
  @keyframes call { 50% { box-shadow: 0 0 6px var(--wait), 0 0 18px rgba(255,178,36,.2); } }

  .count { margin-top: 48px; text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; }
  .count b { font-weight: 400; color: var(--wait); }
  .corner { position: fixed; bottom: 28px; right: 32px; display: flex; gap: 28px; color: var(--dim); }
  .corner .get { color: var(--text); }

  @media (max-width: 520px) {
    .field { grid-template-columns: repeat(8, 14px); }
    .corner { right: 0; left: 0; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .a.wait { animation: none; }
  }
</style>
</head>
<body>
  <main class="field" id="field" aria-label="Your agents"></main>
  <p class="count" id="count" aria-live="polite"></p>
  <nav class="corner">
    <a href="https://github.com/Mopra/horadric.dev">source</a>
    <a class="get" href="https://github.com/Mopra/horadric.dev/releases/latest">download for windows</a>
  </nav>

<script>
  // Each square is an agent. Working ones flicker with activity; now and then
  // one stops and waits for you, and a click sends it back to work.
  const N = matchMedia("(max-width: 520px)").matches ? 40 : 48;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const field = document.getElementById("field");
  const count = document.getElementById("count");
  const agents = [];

  for (let i = 0; i < N; i++) {
    const el = document.createElement("button");
    el.className = "a";
    el.tabIndex = -1;
    el.setAttribute("aria-label", "agent");
    el.addEventListener("click", () => answer(i));
    field.append(el);
    agents.push({ el, state: Math.random() < 0.8 ? "work" : "off" });
  }

  function paint(i) {
    const a = agents[i];
    a.el.className = "a " + a.state;
    a.el.tabIndex = a.state === "wait" ? 0 : -1;
    a.el.setAttribute("aria-label", a.state === "wait" ? "agent waiting, answer it" : "agent");
  }

  function tally() {
    const working = agents.filter((a) => a.state === "work").length;
    const waiting = agents.filter((a) => a.state === "wait").length;
    count.innerHTML = `${working} agents working. ` + (waiting ? `<b>${waiting} need${waiting === 1 ? "s" : ""} you.</b>` : "none need you.");
  }

  function answer(i) {
    const a = agents[i];
    if (a.state !== "wait") return;
    clearTimeout(a.timer);
    a.state = "done";
    paint(i);
    tally();
    setTimeout(() => { a.state = "work"; paint(i); tally(); }, 600);
  }

  // Activity: working squares change brightness in small steps, like drive lights.
  function flicker() {
    for (const a of agents) {
      if (a.state === "work" && Math.random() < 0.18) {
        a.el.style.setProperty("--l", 18 + Math.floor(Math.random() * 5) * 14 + "%");
      }
    }
  }

  function call() {
    const waiting = agents.filter((a) => a.state === "wait").length;
    if (waiting < 2) {
      const candidates = agents.map((a, i) => i).filter((i) => agents[i].state === "work");
      const i = candidates[Math.floor(Math.random() * candidates.length)];
      agents[i].state = "wait";
      paint(i);
      // Nobody answering? It gets answered anyway, so the field never freezes.
      agents[i].timer = setTimeout(() => answer(i), 9000);
    }
    // Agents start and stop too.
    const j = Math.floor(Math.random() * N);
    if (agents[j].state === "off") agents[j].state = "work";
    else if (agents[j].state === "work" && Math.random() < 0.3) agents[j].state = "off";
    paint(j);
    tally();
    setTimeout(call, 2200 + Math.random() * 2600);
  }

  agents.forEach((_, i) => paint(i));
  flicker();
  tally();
  if (!reduced) setInterval(flicker, 140);
  setTimeout(call, 1200);
</script>
</body>
</html>
